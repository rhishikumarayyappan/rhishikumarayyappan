<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title { font: 700 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .sub   { font: 500 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cfe8f3; letter-spacing: 1px; }
      .fade  { opacity: 0; animation: fadeIn 1.2s ease-out forwards; }
      .fade2 { opacity: 0; animation: fadeIn 1.2s ease-out .5s forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .wave1 { animation: drift 9s ease-in-out infinite alternate; }
      .wave2 { animation: drift 13s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
      .node { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .8; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <!-- neural-network dots -->
  <g fill="#36BCF7">
    <circle class="node" cx="90" cy="60" r="4"/><circle class="node" cx="160" cy="110" r="3" style="animation-delay:.6s"/>
    <circle class="node" cx="70" cy="150" r="3" style="animation-delay:1.2s"/><circle class="node" cx="1080" cy="55" r="4" style="animation-delay:.3s"/>
    <circle class="node" cx="1130" cy="120" r="3" style="animation-delay:.9s"/><circle class="node" cx="1040" cy="150" r="3" style="animation-delay:1.5s"/>
  </g>
  <g stroke="#36BCF7" stroke-opacity=".25" stroke-width="1">
    <line x1="90" y1="60" x2="160" y2="110"/><line x1="160" y1="110" x2="70" y2="150"/><line x1="90" y1="60" x2="70" y2="150"/>
    <line x1="1080" y1="55" x2="1130" y2="120"/><line x1="1130" y1="120" x2="1040" y2="150"/><line x1="1080" y1="55" x2="1040" y2="150"/>
  </g>
  <!-- waves -->
  <path class="wave2" fill="#36BCF7" fill-opacity=".10" d="M0 222 Q 150 196 300 222 T 600 222 T 900 222 T 1200 222 T 1500 222 V260 H0 Z"/>
  <path class="wave1" fill="#ffffff" fill-opacity=".07" d="M0 235 Q 150 258 300 235 T 600 235 T 900 235 T 1200 235 T 1500 235 V260 H0 Z"/>
  <text class="title fade" x="600" y="118" text-anchor="middle">Rhishi Kumar Ayyappan</text>
  <rect class="fade2" x="500" y="138" width="200" height="4" rx="2" fill="url(#accent)"/>
  <text class="sub fade2" x="600" y="180" text-anchor="middle">Applied AI Engineer  •  Trustworthy &amp; Agentic AI  •  MSc AI, University of Galway</text>
</svg>
